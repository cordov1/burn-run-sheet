<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09090B">
<title>Run sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #09090B; --tile: #1A1A1D; --tile-2: #232327; --line: rgba(255,255,255,0.07);
    --text: #F5F5F7; --muted: #8E8E93; --dim: #5A5A60;
    --burn: #FF9F0A; --bupe: #BF5AF2; --txa: #0A84FF; --harv: #30D158; --chk: #64D2FF; --img: #FFD60A; --tmrw: #8E8E93;
    --late: #FF453A; --ok: #30D158;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  }
  html, body { margin: 0; }
  body { font-family: var(--font); font-size: 17px; line-height: 1.3; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .app { max-width: 1480px; margin: 0 auto; padding: 24px 28px 48px; }

  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin: 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 .wk { color: var(--muted); font-weight: 400; }
  h1 .wk:empty { display: none; }
  .nav { display: inline-flex; gap: 6px; align-self: center; }
  .nav a, .pill { background: var(--tile); color: var(--text); border-radius: 999px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; transition: transform .1s ease-out, background .15s; }
  .nav a { width: 32px; height: 32px; display: inline-grid; place-items: center; font-size: 19px; line-height: 1; }
  .nav a:active, .pill:active { transform: scale(0.95); }
  .pill { font-size: 15px; font-weight: 500; padding: 7px 14px; display: inline-flex; align-items: center; gap: 7px; }
  .pill[hidden] { display: none; }
  .pill.on { background: var(--txa); color: #fff; }
  .side { display: flex; align-items: center; gap: 14px; font-size: 15px; color: var(--muted); flex-wrap: wrap; }
  .side b { color: var(--text); font-weight: 600; }
  .side .st { font-variant-numeric: tabular-nums; }
  .side .st.bad { color: var(--late); }

  .notice { background: var(--tile); border-radius: 16px; padding: 12px 18px; margin: 0 0 14px; font-size: 15px; color: var(--muted); white-space: pre-line; }
  .notice.warn { color: var(--img); }
  .notice.bad { color: var(--late); }

  .now { display: flex; align-items: center; gap: 22px; background: var(--tile); border-radius: 24px; padding: 20px 26px; margin-bottom: 20px; min-height: 96px; }
  .now .k { font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--c, var(--muted)); }
  .now .t { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
  .now .t small { font-size: 18px; color: var(--muted); font-weight: 600; letter-spacing: 0; margin-left: 4px; }
  .now .w { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; min-width: 0; }
  .now .w span { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 18px; }
  .now .in { margin-left: auto; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--c, var(--text)); text-align: right; white-space: nowrap; }
  .now .in small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .now.late { box-shadow: inset 0 0 0 2px var(--late); }
  .now.late .k, .now.late .in, .now.late .t { color: var(--late); }
  .now.quiet .w { font-size: 20px; color: var(--muted); font-weight: 500; }

  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 290px; gap: 20px; align-items: start; }

  /* ---------- day calendar ---------- */
  .cal { background: var(--tile); border-radius: 24px; padding: 18px 16px 14px 14px; min-width: 0; }
  .cal h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .cal h2 .n { margin-left: auto; font-size: 14px; font-weight: 500; color: var(--muted); }
  .cal .grid { position: relative; margin-left: 44px; }
  .cal .hr { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
  .cal .hr b { position: absolute; left: -46px; top: -7px; width: 40px; text-align: right; font-size: 11px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cal .ev { position: absolute; border-radius: 8px; background: color-mix(in srgb, var(--c) 24%, var(--tile)); border-left: 3px solid var(--c); padding: 3px 8px; min-height: 22px; overflow: hidden; font-size: 12.5px; line-height: 1.25; }
  .cal .ev b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal .ev span { color: var(--muted); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cal .ev.done { opacity: .4; }
  .cal .ev.late { box-shadow: inset 0 0 0 1.5px var(--late); }
  .cal .ev.soft { background: transparent; border-left-style: dashed; box-shadow: inset 0 0 0 1px var(--line); }
  .cal .nowline { position: absolute; left: -4px; right: 0; height: 2px; background: var(--late); z-index: 2; }
  .cal .nowline::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--late); }
  @media (max-width: 1180px) {
    .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cal { grid-column: 1 / -1; }
  }
  .colm { display: grid; gap: 20px; min-width: 0; }
  .tile { background: var(--tile); border-radius: 24px; padding: 18px 22px 10px; min-width: 0; }
  .tile h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; color: var(--c); }
  .tile h2 .n { margin-left: auto; font-size: 14px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tile h2 .n.all { color: var(--ok); }
  .tile .sub { font-size: 15px; color: var(--muted); margin: 0 0 8px; }
  .tile .empty { font-size: 15px; color: var(--muted); padding: 2px 0 10px; }

  .ln { display: grid; grid-template-columns: 104px minmax(0, 1fr) 26px; align-items: center; gap: 12px; min-height: 52px; padding: 5px 0; border-top: 1px solid var(--line); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .ln:first-of-type { border-top: 0; }
  .ln.static { cursor: default; }
  .ln .t { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ln .t small { font-size: 15px; color: var(--muted); margin-left: 5px; font-weight: 600; letter-spacing: 0; }
  .ln .t.none { font-size: 15px; color: var(--muted); font-weight: 500; }
  .ln .w { min-width: 0; font-size: 17px; line-height: 1.3; }
  .ln .w b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .ln .w .s { color: var(--muted); margin-left: 8px; font-size: 15px; }
  .ln .w .m { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
  .ln .w .d { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .ln .c { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--dim); display: grid; place-items: center; justify-self: end; transition: background .15s ease-out, border-color .15s ease-out, transform .15s cubic-bezier(0.32,0.72,0,1); }
  .ln .c svg { width: 13px; height: 13px; opacity: 0; transition: opacity .15s ease-out; }
  .ln:active .c { transform: scale(0.9); }
  .ln.done .c { background: var(--c); border-color: var(--c); }
  .ln.done .c svg { opacity: 1; }
  .ln.locked .c { background: var(--dim); border-color: var(--dim); }
  .ln.locked { cursor: default; }
  .ln.done .t, .ln.done .w { color: var(--dim); }
  .ln.done .w b { text-decoration: line-through; }
  .ln.done .w .s, .ln.done .w .d, .ln.done .w .m, .ln.done .t small { color: var(--dim); }
  .ln.next .t { color: var(--c); }
  .ln.late .t, .ln.late .w b { color: var(--late); }
  .ln.late .t small { color: var(--late); }
  .tile.tmrw .ln .t { font-size: 17px; }

  .foot { margin-top: 22px; font-size: 13px; color: var(--dim); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  @media (max-width: 900px) {
    .app { padding: 16px 14px 44px; }
    .top { margin-bottom: 12px; gap: 10px; }
    h1 { font-size: 26px; gap: 10px; }
    h1 .wk { display: none; }
    .side { gap: 10px; font-size: 14px; }
    .pill { font-size: 14px; padding: 6px 12px; }
    .now { padding: 16px 18px; gap: 14px; flex-wrap: wrap; border-radius: 20px; }
    .now .k { flex-basis: 100%; }
    .now .t { font-size: 32px; } .now .w { font-size: 20px; } .now .w span { display: block; margin: 2px 0 0; font-size: 15px; }
    .now .in { font-size: 24px; }
    .board { grid-template-columns: 1fr; gap: 14px; }
    .colm { display: contents; }
    .cal { order: 8; border-radius: 20px; }
    .tile { border-radius: 20px; padding: 14px 16px 8px; }
    .tile.o1 { order: 1; } .tile.o2 { order: 2; } .tile.o3 { order: 3; } .tile.o4 { order: 4; } .tile.o5 { order: 5; } .tile.o6 { order: 6; } .tile.o7 { order: 7; } .tile.o8 { order: 8; }
    .ln { grid-template-columns: 92px minmax(0, 1fr) 26px; gap: 10px; }
    .ln .t { font-size: 20px; } .ln .t small { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { .ln .c, .ln .c svg, .nav a, .pill { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1><span id="dateLabel">Loading…</span><span class="wk" id="weekLabel"></span><span class="nav"><a id="prev" role="button" aria-label="Previous day">‹</a><a id="next" role="button" aria-label="Next day">›</a></span><a class="pill" id="todayBtn" role="button" hidden>Today</a></h1>
    <div class="side"><span id="progress"></span><span class="st" id="clock"></span><span class="st" id="sheetStatus"></span><a class="pill" id="alerts" role="button">Alerts off</a><a class="pill" id="initials" role="button" title="Your initials, stamped on each tick">Initials</a></div>
  </header>
  <div id="notices"></div>
  <div class="now quiet" id="now"><div class="w">Reading the Sheet…</div></div>
  <div class="board" id="board"></div>
  <footer class="foot"><span>Reads the Google Sheet live · never writes to it · Central time</span><span id="tickStatus"></span></footer>
</div>
<script>
(() => {
  'use strict';
  const SHEET_ID = '1hiQNkzE2BN3d4ExU9oGEm-KUc4jDhm6_3Iya5Wh0y0c';
  const TICKS_URL = '';            // Apps Script web app URL from ticks-backend.gs. Empty = ticks stay on this device.
  const TZ = 'America/Chicago';
  const SHEET_REFRESH_MS = 60000;
  const TICK_POLL_MS = 20000;
  const COL = { A: 0, B: 1, C: 2, D: 3, E: 4, F: 5, G: 6, H: 7, I: 8, J: 9, K: 10, L: 11, M: 12, N: 13, O: 14, P: 15, Q: 16, R: 17, S: 18 };
  const ID_RE = /^(\d{5})\b/;
  const RANGE_RE = /^\d{1,2}:\d{2}\s*[AP]M\s*[-–]\s*\d{1,2}:\d{2}\s*[AP]M/i;
  const TOTAL_RE = /^TOTAL\s+(\d+)\s*:/i;
  const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const qs = (o) => Object.entries(o).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } } };

  // ---------- Central time ----------
  function centralParts() {
    const f = new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', hourCycle: 'h23' });
    const p = {};
    for (const x of f.formatToParts(new Date())) if (x.type !== 'literal') p[x.type] = +x.value;
    return p;
  }
  const centralToday = () => { const p = centralParts(); return new Date(Date.UTC(p.year, p.month - 1, p.day, 12)); };
  const centralNowMin = () => { const p = centralParts(); return (p.hour % 24) * 60 + p.minute; };
  const centralNowSec = () => { const p = centralParts(); return ((p.hour % 24) * 60 + p.minute) * 60 + (p.second || 0); };
  const centralClock = (withSeconds) => new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit', ...(withSeconds ? { second: '2-digit' } : {}) }).format(new Date());
  const md = (d) => `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
  const addDays = (d, n) => new Date(d.getTime() + n * 86400000);
  const longDate = (d) => `${WD[d.getUTCDay()]} ${MON[d.getUTCMonth()]} ${d.getUTCDate()}`;
  const fullDate = (d) => `${WDL[d.getUTCDay()]}, ${MONL[d.getUTCMonth()]} ${d.getUTCDate()}`;
  const fmtClock = (h, m) => `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;
  const fmtMin = (min) => fmtClock(Math.floor(min / 60) % 24, min % 60);
  function toMin(s) {
    const m = /(\d{1,2}):(\d{2})\s*([AP])\.?M/i.exec(s || '');
    if (!m) return null;
    let h = (+m[1]) % 12;
    if (m[3].toUpperCase() === 'P') h += 12;
    return h * 60 + (+m[2]);
  }
  const splitTime = (s) => { const m = /^(\d{1,2}:\d{2})\s*([AP]M)$/i.exec((s || '').trim()); return m ? { hm: m[1], ap: m[2].toUpperCase() } : { hm: s || '', ap: '' }; };
  const timeHTML = (s) => { const t = splitTime(s); return `<span class="t">${esc(t.hm)}${t.ap ? `<small>${t.ap}</small>` : ''}</span>`; };
  const minsText = (m) => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} min`;

  // ---------- Reading the Sheet (gviz JSON; JSONP fallback) ----------
  const gvizUrl = (sheet, extra) => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheet)}&headers=1&tqx=out:json${extra || ''}`;
  function parseGviz(text) {
    const i = text.indexOf('{'), j = text.lastIndexOf('}');
    if (i < 0 || j < i) throw new Error('unexpected answer from the Sheet');
    const data = JSON.parse(text.slice(i, j + 1));
    if (data.status !== 'ok') throw new Error('Sheet said ' + ((data.errors && data.errors[0] && data.errors[0].message) || data.status));
    return data.table;
  }
  async function fetchTable(sheet) {
    try {
      const r = await fetch(gvizUrl(sheet), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return parseGviz(await r.text());
    } catch (e) {
      return jsonpTable(sheet);
    }
  }
  function jsonpTable(sheet) {
    return new Promise((resolve, reject) => {
      const cb = 'gviz_' + Math.random().toString(36).slice(2);
      const s = document.createElement('script');
      let timer = 0;
      const finish = (fn) => { clearTimeout(timer); delete window[cb]; s.remove(); fn(); };
      window[cb] = (p) => finish(() => (p && p.status === 'ok') ? resolve(p.table) : reject(new Error('Sheet said ' + (p && p.status))));
      s.onerror = () => finish(() => reject(new Error('could not reach the Sheet')));
      timer = setTimeout(() => finish(() => reject(new Error('the Sheet did not answer'))), 15000);
      s.src = gvizUrl(sheet, ';responseHandler:' + cb);
      document.head.appendChild(s);
    });
  }

  // ---------- Cells ----------
  const cell = (row, c) => { const x = row.c && row.c[COL[c]]; return x && x.v != null && x.v !== '' ? x : null; };
  const str = (row, c) => { const x = cell(row, c); return x ? String(x.v).trim() : ''; };
  function clock(row, c) {
    const x = cell(row, c);
    if (!x) return '';
    if (x.f) return String(x.f).trim();
    const m = /Date\(\d+,\d+,\d+,(\d+),(\d+)/.exec(String(x.v));
    if (m) return fmtClock(+m[1], +m[2]);
    if (typeof x.v === 'number' && x.v >= 0 && x.v < 1) return fmtMin(Math.round(x.v * 1440));
    return String(x.v).trim();
  }

  // ---------- Calendar tab: day blocks (col B date, merged down the block) ----------
  function buildDays(table) {
    const days = [];
    let cur = null;
    for (const row of table.rows || []) {
      if (!row || !row.c) continue;
      const b = str(row, 'B');
      if (b) { cur = { date: b, weekday: str(row, 'C'), week: str(row, 'A'), rows: [] }; days.push(cur); }
      if (cur) cur.rows.push(row);
    }
    return days;
  }
  function parseArmTp(text) {
    let m = /\((?:WT\s+)?([^,()]+),\s*([^)]+)\)/.exec(text);
    if (!m) m = /:\s*(?:WT\s+)?([^,]+),\s*([^(]+)/.exec(text);
    return { arm: m ? m[1].replace(/\s+/g, '').toUpperCase() : '', tp: m ? m[2].trim() : '' };
  }
  const armLabel = (arm) => (arm.replace(/^CTX\+/, '').replace(/\+/g, ' + ')) || arm || 'CTX';
  const hasTXA = (arm) => /TXA/.test(arm);
  const tpLabel = (tp) => (tp || '').replace(/^(\d+)h$/i, '$1 h');

  function parseDay(day) {
    const out = { date: day.date, weekday: day.weekday, week: day.week, injuries: [], harvests: [], txa: [], bupe: [], info: [], checksSummary: '', imaging: [], notes: [], warnings: [] };
    const counters = {};
    const finish = (c) => { const k = counters[c]; if (k && k.got !== k.expected) out.warnings.push(`${k.name}: Sheet says TOTAL ${k.expected} but has ${k.got} lines`); counters[c] = null; };
    const start = (c, name, text) => { finish(c); counters[c] = { name, expected: +TOTAL_RE.exec(text)[1], got: 0 }; };
    const bump = (c) => { if (counters[c]) counters[c].got++; };
    let gBlock = '', jBlock = '';
    for (const row of day.rows) {
      const g = str(row, 'G');
      if (g) {
        if (ID_RE.test(g)) { bump('G'); const { arm, tp } = parseArmTp(g); out.injuries.push({ tag: g.slice(0, 5), arm, tp, target: clock(row, 'H'), actual: clock(row, 'I'), block: gBlock }); }
        else if (TOTAL_RE.test(g)) start('G', 'Injuries', g);
        else if (RANGE_RE.test(g)) { finish('G'); gBlock = g; }
        else { finish('G'); out.info.push(g); }
      }
      const j = str(row, 'J');
      if (j) {
        if (ID_RE.test(j)) { bump('J'); const { arm, tp } = parseArmTp(j); out.harvests.push({ tag: j.slice(0, 5), arm, tp, sameDay: /same-day/i.test(j), due: clock(row, 'K'), actual: clock(row, 'L'), block: jBlock }); }
        else if (TOTAL_RE.test(j)) start('J', 'Harvests', j);
        else if (RANGE_RE.test(j)) { finish('J'); jBlock = j; }
        else { finish('J'); out.info.push(j); }
      }
      const m = str(row, 'M');
      if (m) {
        if (ID_RE.test(m)) {
          bump('M');
          const doses = m.slice(m.indexOf(':') + 1).split(',').map((s) => s.trim()).filter(Boolean);
          const dues = str(row, 'N').split(',').map((s) => s.trim());
          doses.forEach((dose, i) => out.txa.push({ tag: m.slice(0, 5), dose, due: dues[i] || '' }));
        } else if (TOTAL_RE.test(m)) start('M', 'TXA', m);
      }
      const o = str(row, 'O');
      if (o) {
        if (/^\d{5}$/.test(o)) { bump('O'); out.bupe.push({ tag: o, window: str(row, 'P') }); }
        else if (TOTAL_RE.test(o)) start('O', 'Bupe', o);
      }
      const q = str(row, 'Q'); if (q) out.checksSummary = q;
      const r = str(row, 'R'); if (r) out.imaging.push(r);
      const s = str(row, 'S'); if (s) out.notes.push(s);
    }
    ['G', 'J', 'M', 'O'].forEach(finish);
    return out;
  }

  // ---------- Checks tab: one multi-line cell per date ----------
  function buildChecks(table) {
    const byDate = {};
    for (const row of table.rows || []) {
      if (!row || !row.c) continue;
      const d = str(row, 'B');
      if (d) byDate[d] = parseChecksText(str(row, 'D'));
    }
    return byDate;
  }
  function parseChecksText(text) {

    if (lines.length && /^TOTAL/i.test(lines[0])) res.head = lines.shift();

      const m = /^(\d{5}):\s*(.*)$/.exec(ln);
      if (!m) continue;

      const nm = /\(([^)]*)\)\s*$/.exec(rest);
      if (nm) { note = nm[1].trim(); rest = rest.slice(0, nm.index).trim(); }
      const parts = rest.split(',').map((s) => s.trim()).filter(Boolean);
      const am = parts.find((p) => /^AM\b/i.test(p)) || '';

  }

  // ---------- Tiles for one day ----------
  const splitWindow = (w) => { const p = (w || '').split(/\s*[-–]\s*/); return { start: p[0] || '', end: p[1] || '' }; };
  const byMin = (a, b) => (a.min ?? 1e9) - (b.min ?? 1e9);
  const tidy = (s) => s.replace(/\s*\+\s*/g, ' + ').replace(/\b(\w)(\w*)/g, (_, a, b) => a.toUpperCase() + b.toLowerCase()).replace(/^(\w)/, (c) => c.toUpperCase());
  const mostCommon = (arr) => { const c = {}; let best = ''; for (const s of arr) { c[s] = (c[s] || 0) + 1; if (!best || c[s] > c[best]) best = s; } return best; };

  function checkLine(kind, mice) {
    const texts = mice.map((m) => (kind === 'am' ? m.am : m.pm).replace(/^(AM|PM)\s*/i, '').trim()).filter(Boolean);
    const base = mostCommon(texts.map((t) => t.replace(/\s*\+\s*bupe/i, '')));
    const label = base ? base.charAt(0).toUpperCase() + base.slice(1).toLowerCase() : (kind === 'am' ? 'Weigh + check' : 'Check');
    const bits = [`${mice.length} ${mice.length === 1 ? 'mouse' : 'mice'}`];
    const withBupe = mice.filter((m) => /\bbupe\b/i.test(kind === 'am' ? m.am : m.pm)).length;
    if (withBupe) bits.push(`${withBupe} with bupe`);
    const notes = {};
    for (const m of mice) if (m.note) notes[m.note] = (notes[m.note] || 0) + 1;
    for (const [note, n] of Object.entries(notes)) bits.push(/^\d+\s*h$/i.test(note) ? `${n} at ${note.toLowerCase().replace(/\s*h$/, ' h')}` : `${n} ${note.toLowerCase()}`);
    return { key: `${kind}|all`, timeLabel: kind.toUpperCase(), label, sub: bits.join(' · '), summary: `${kind.toUpperCase()} ${label.toLowerCase()} · ${mice.length} mice`, order: kind === 'am' ? -1 : 1e9 };
  }

  function buildTiles(p, chk) {
    const tiles = [];
    const am = chk.mice.filter((m) => m.am), pm = chk.mice.filter((m) => m.pm);
    if (am.length || pm.length) tiles.push({ id: 'chk', title: 'Checks', color: 'var(--chk)', lines: [am.length ? checkLine('am', am) : null, pm.length ? checkLine('pm', pm) : null].filter(Boolean) });

    if (p.injuries.length) tiles.push({ id: 'burn', title: 'Burns', color: 'var(--burn)', lines: p.injuries.map((i) => {
      const time = i.actual || i.target;
      const planned = i.actual && i.target && toMin(i.actual) !== toMin(i.target) ? ` · planned ${i.target}` : '';
      return { key: `inj|${i.tag}`, time, min: toMin(time), label: i.tag, sub: [tpLabel(i.tp), hasTXA(i.arm) ? 'TXA' : ''].filter(Boolean).join(' · '),
        locked: !!i.actual, meta: i.actual ? `burned ${i.actual}${planned}` : '', summary: `Burn ${i.tag}${i.tp ? ' · ' + tpLabel(i.tp) : ''}` };
    }).sort(byMin) });

    if (p.bupe.length) {
      const ws = p.bupe.map((b) => { const w = splitWindow(b.window); return { tag: b.tag, start: w.start, end: w.end, min: toMin(w.start), endMin: toMin(w.end) }; }).sort(byMin);
      const groups = [];
      for (const w of ws) {
        const g = groups[groups.length - 1];
        if (g && w.min != null && g.min != null && w.min - g.min <= 60) { g.items.push(w); g.endMin = Math.min(g.endMin ?? 1e9, w.endMin ?? 1e9); }
        else groups.push({ min: w.min, endMin: w.endMin, items: [w] });
      }
      tiles.push({ id: 'bupe', title: 'Bupe', color: 'var(--bupe)', lines: groups.map((g) => {
        const tags = g.items.map((w) => w.tag);
        const end = g.endMin != null && g.endMin < 1e9 ? fmtMin(g.endMin) : (g.items[0].end || '');
        const one = tags.length === 1;
        return { key: 'bupe|' + [...tags].sort().join('+'), time: g.items[0].start, min: g.min, endMin: g.endMin < 1e9 ? g.endMin : null,
          label: one ? tags[0] : `${tags.length} mice`, sub: end ? `by ${end}` : '', ids: one ? '' : tags.join(' · '), summary: one ? `Bupe ${tags[0]}` : `Bupe · ${tags.length} mice` };
      }) });
    }

    if (p.txa.length) tiles.push({ id: 'txa', title: 'TXA', color: 'var(--txa)', lines: p.txa.map((t) => ({
      key: `txa|${t.tag}|${t.dose}`, time: t.due, min: toMin(t.due), label: t.tag, sub: t.dose.replace(/\s*hr\b/i, ' h'), summary: `TXA ${t.tag} · ${t.dose.replace(/\s*hr\b/i, ' h')}` })).sort(byMin) });

    const hv = p.harvests.filter((h) => !h.info);
    if (hv.length) tiles.push({ id: 'harv', title: 'Harvests', color: 'var(--harv)', lines: hv.map((h) => ({
      key: `harv|${h.tag}`, time: h.actual && toMin(h.actual) != null ? h.actual : h.due, timeNone: 'any time', min: toMin(h.actual && toMin(h.actual) != null ? h.actual : h.due), label: h.tag,
      sub: [tpLabel(h.tp), h.sameDay ? 'same-day' : ''].filter(Boolean).join(' · '), locked: !!h.actual, meta: h.actual ? `harvested ${h.actual}` : '', summary: `Harvest ${h.tag}${h.tp ? ' · ' + tpLabel(h.tp) : ''}` })).sort(byMin) });

    if (p.imaging.length) tiles.push({ id: 'img', title: 'Photos / X-rays', color: 'var(--img)', lines: p.imaging.map((t, i) => ({ key: `img|${i}`, timeNone: '', label: '', sub: t, summary: t })) });
    return tiles;
  }

  function summarize(p, chk) {
    const n = (k, one, many) => k ? `${k} ${k === 1 ? one : many}` : '';
    return [
      n(p.injuries.length, 'burn', 'burns'),
      n(p.harvests.filter((h) => !h.info).length, 'harvest', 'harvests'),
      n(p.txa.length, 'TXA dose', 'TXA doses'),
      n(p.bupe.length, 'bupe', 'bupe'),
      (chk.mice.some((m) => m.am || m.pm)) ? `${chk.mice.filter((m) => m.am).length} AM / ${chk.mice.filter((m) => m.pm).length} PM checks` : '',
    ].filter(Boolean).join(' · ') || 'nothing scheduled';
  }

  // ---------- Prep for tomorrow (rules live in prep-rules.js) ----------
  function prepTasks(rules, p, chk) {
    const info = (tag) => (window.MOUSE_INFO && window.MOUSE_INFO[tag]) || {};
    const pools = {
      injury: p.injuries.map((i) => ({ tag: i.tag, tp: i.tp, arm: armLabel(i.arm), time: i.target, txa: hasTXA(i.arm) ? 'yes' : 'no', burn: /BURN/.test(i.arm) ? 'yes' : 'no', ...info(i.tag) })),
      harvest: p.harvests.filter((h) => !h.info).map((h) => ({ tag: h.tag, tp: h.tp, arm: armLabel(h.arm), time: h.due, txa: hasTXA(h.arm) ? 'yes' : 'no', burn: /BURN/.test(h.arm) ? 'yes' : 'no', sameDay: h.sameDay ? 'yes' : 'no', ...info(h.tag) })),
      txa: [...new Set(p.txa.map((t) => t.tag))].map((tag) => ({ tag, time: (p.txa.find((t) => t.tag === tag) || {}).due || '', ...info(tag) })),
      bupe: p.bupe.map((b) => ({ tag: b.tag, time: b.window, ...info(b.tag) })),
      am_check: chk.mice.filter((m) => m.am).map((m) => ({ tag: m.tag, note: m.note, ...info(m.tag) })),
      pm_check: chk.mice.filter((m) => m.pm).map((m) => ({ tag: m.tag, note: m.note, ...info(m.tag) })),
    };
    pools.any = Object.values(pools).some((a) => a.length) ? [{ tag: '' }] : [];
    const fill = (tpl, it) => String(tpl || '').replace(/\{(\w+)\}/g, (_, k) => it[k] != null ? String(it[k]) : '');
    const tasks = [];
    rules.forEach((rule, idx) => {
      if (!rule || typeof rule !== 'object') return;
      let items = pools[rule.when] || [];
      if (rule.match) items = items.filter((it) => Object.entries(rule.match).every(([k, v]) => String(it[k] ?? '').toLowerCase() === String(v).toLowerCase()));
      if (!items.length) return;
      const id = rule.id || ('rule' + (idx + 1));
      if (rule.per === 'mouse') items.forEach((it) => { const label = rule.label ? fill(rule.label, it) : it.tag; tasks.push({ key: `prep|${id}|${it.tag}`, time: rule.time || '', timeNone: '', label, sub: fill(rule.task, it), summary: [label, fill(rule.task, it)].filter(Boolean).join(' · ') }); });
      else { const tags = items.map((i) => i.tag).filter(Boolean); const it = { n: items.length, tags: tags.join(', ') }; const label = fill(rule.label, it); tasks.push({ key: `prep|${id}`, time: rule.time || '', timeNone: '', label, sub: fill(rule.task, it), ids: rule.ids ? tags.join(' · ') : '', summary: [label, fill(rule.task, it)].filter(Boolean).join(' · ') }); }
    });

  }
  function tomorrowTile() {
    const tomorrow = addDays(view, 1), tStr = md(tomorrow);
    const rules = Array.isArray(window.PREP_RULES) ? window.PREP_RULES : [];
    const day = days.find((d) => d.date === tStr);
    const chk = checks[tStr] || { head: '', mice: [] };
    const p = day ? parseDay(day) : null;
    const tile = { id: 'tmrw', title: 'Tomorrow', color: 'var(--tmrw)', sub: '', lines: [], empty: '' };
    if (!p) { tile.sub = `${longDate(tomorrow)} · not on the Calendar`; return tile; }
    tile.sub = `${longDate(tomorrow)} · ${summarize(p, chk)}`;
    const tasks = prepTasks(rules, p, chk);
    if (!rules.length) tile.empty = 'Prep list appears here once the rules are in.';
    else if (!tasks.length) tile.empty = 'Nothing to prep.';
    else tile.lines = tasks;
    return tile;
  }

  // ---------- Ticks (shared via TICKS_URL when set; always mirrored on this device) ----------
  let ticksByDate = {};
  const tickOf = (dateStr, key) => (ticksByDate[dateStr] || {})[key];
  function loadLocal() { try { ticksByDate = JSON.parse(store.get('runsheet.ticks') || '{}') || {}; } catch (e) { ticksByDate = {}; } }
  function saveLocal() { store.set('runsheet.ticks', JSON.stringify(ticksByDate)); }
  async function fetchJSON(url) {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  function applyShared(dateStr, res) {
    if (!res || typeof res.ticks !== 'object') throw new Error('bad answer');
    ticksByDate[dateStr] = res.ticks;
    saveLocal();
  }
  async function loadShared(dateStr) {
    if (!TICKS_URL) return;
    try {
      applyShared(dateStr, await fetchJSON(`${TICKS_URL}?${qs({ action: 'get', date: dateStr })}`));
      setTickStatus('', 'Ticks shared · synced ' + centralClock(false));
      render();
    } catch (e) {
      setTickStatus('bad', 'Shared ticks unreachable — showing this device’s ticks');
    }
  }
  async function setTick(key, done) {
    const dateStr = md(view);
    const by = initials();
    const map = ticksByDate[dateStr] = ticksByDate[dateStr] || {};
    if (done) map[key] = { by, at: centralClock(false) }; else delete map[key];
    saveLocal();
    render();
    if (!TICKS_URL) return;
    try {
      applyShared(dateStr, await fetchJSON(`${TICKS_URL}?${qs({ action: 'set', date: dateStr, key, done: done ? 1 : 0, by })}`));
      setTickStatus('', 'Ticks shared · synced ' + centralClock(false));
      render();
    } catch (e) {
      setTickStatus('bad', 'Tick kept on this device only — shared list unreachable');
    }
  }
  const initials = () => (store.get('runsheet.initials') || '').trim().toUpperCase();

  // ---------- Rendering ----------
  let days = [], checks = {}, lastRead = '', view = centralToday();
  let nowItem = null, lateItems = [], pendingTimed = [];

  function lineState(l, dateStr) {
    const t = l.locked ? null : tickOf(dateStr, l.key);
    return { done: !!(l.locked || t), tick: t };
  }
  function lineHTML(l, dateStr, isToday, nowMin, nextKey) {
    const st = lineState(l, dateStr);
    const end = l.endMin ?? l.min;
    const late = isToday && !st.done && end != null && end < nowMin;
    const cls = ['ln', st.done ? 'done' : '', l.locked ? 'locked' : '', (!st.done && l.key === nextKey) ? 'next' : '', late ? 'late' : ''].filter(Boolean).join(' ');
    const time = l.timeLabel ? `<span class="t">${esc(l.timeLabel)}</span>` : (l.time && l.min != null ? timeHTML(l.time) : `<span class="t none">${esc(l.time || l.timeNone || '')}</span>`);
    const meta = l.locked ? l.meta : (st.tick ? [st.tick.by, st.tick.at].filter(Boolean).join(' · ') : '');
    return `<div class="${cls}" data-key="${esc(l.key)}"${l.locked ? ' data-locked="1"' : ''}>${time}<span class="w">${l.label ? `<b>${esc(l.label)}</b>` : ''}${l.sub ? `<span class="s">${esc(l.sub)}</span>` : ''}${meta ? `<span class="m">${esc(meta)}</span>` : ''}${l.ids ? `<span class="d">${esc(l.ids)}</span>` : ''}</span><span class="c">${CHECK}</span></div>`;
  }
  function tileHTML(t, dateStr, isToday, nowMin, nextKey, order) {
    const doneN = t.lines.filter((l) => lineState(l, dateStr).done).length;
    const count = t.lines.length ? `<span class="n${doneN === t.lines.length ? ' all' : ''}">${doneN} of ${t.lines.length}</span>` : '';
    const body = t.lines.map((l) => lineHTML(l, dateStr, isToday, nowMin, nextKey)).join('') || (t.empty ? `<div class="empty">${esc(t.empty)}</div>` : '');
    return `<section class="tile ${t.id === 'tmrw' ? 'tmrw' : ''} o${order}" style="--c:${t.color}"><h2>${esc(t.title)}${count}</h2>${t.sub ? `<p class="sub">${esc(t.sub)}</p>` : ''}${body}</section>`;
  }

  function computeNow(tiles, dateStr, nowMin) {
    const timed = [], late = [];
    for (const t of tiles) if (t.id !== 'tmrw') for (const l of t.lines) {
      if (lineState(l, dateStr).done) continue;
      if (l.min == null) continue;
      const end = l.endMin ?? l.min;
      const item = { ...l, end, tile: t };
      if (end < nowMin) late.push(item); else timed.push(item);
    }
    timed.sort(byMin); late.sort(byMin);
    return { timed, late };
  }

  function nowHTML(tiles, dateStr, isToday, nowMin) {
    const el = $('now');
    el.className = 'now';
    if (!isToday) { el.classList.add('quiet'); el.innerHTML = `<div class="w">Viewing ${esc(fullDate(view))}<span>· the Now card follows today only</span></div>`; nowItem = null; lateItems = []; pendingTimed = []; return; }
    const { timed, late } = computeNow(tiles, dateStr, nowMin);
    pendingTimed = timed; lateItems = late;
    const chk = tiles.find((t) => t.id === 'chk');
    const amLine = chk && chk.lines.find((l) => l.key === 'am|all'), pmLine = chk && chk.lines.find((l) => l.key === 'pm|all');
    const amPending = amLine && !lineState(amLine, dateStr).done, pmPending = pmLine && !lineState(pmLine, dateStr).done;
    const thenText = (it) => it ? `then ${it.time} ${it.summary.replace(/^(\w)/, (c) => c.toLowerCase())}` : '';
    if (late.length) {
      const l = late[0];
      nowItem = l;
      el.classList.add('late'); el.style.setProperty('--c', 'var(--late)');
      el.innerHTML = `<div><div class="k">Late</div>${timeHTML(l.time)}</div><div class="w">${esc(l.summary)}<span>${esc(late.length > 1 ? `and ${late.length - 1} more late` : thenText(timed[0]))}</span></div><div class="in" id="cd">${esc(minsText(nowMin - l.end))}<small>late</small></div>`;
      return;
    }
    if (amPending && (!timed.length || nowMin < timed[0].min)) {
      nowItem = null;
      el.style.setProperty('--c', 'var(--chk)');
      el.innerHTML = `<div><div class="k">Now</div><span class="t">AM</span></div><div class="w">${esc(amLine.label)}<span>${esc(amLine.sub)}${timed.length ? ` · ${thenText(timed[0])}` : ''}</span></div>`;
      return;
    }
    if (timed.length) {
      const n = timed[0];
      nowItem = n;
      el.style.setProperty('--c', n.tile.color);
      const open = n.min <= nowMin;
      const label = open ? 'Now' : 'Next';
      const cd = open ? (n.endMin != null ? `<div class="in" id="cd">${esc(minsText(n.end - nowMin))}<small>left in window</small></div>` : `<div class="in" id="cd">due<small>now</small></div>`) : `<div class="in" id="cd">${esc(minsText(n.min - nowMin))}<small>until due</small></div>`;
      el.innerHTML = `<div><div class="k">${label}</div>${timeHTML(n.time)}</div><div class="w">${esc(n.summary)}<span>${esc(thenText(timed[1]))}</span></div>${cd}`;
      return;
    }
    nowItem = null;
    if (pmPending) { el.style.setProperty('--c', 'var(--chk)'); el.innerHTML = `<div><div class="k">Now</div><span class="t">PM</span></div><div class="w">${esc(pmLine.label)}<span>${esc(pmLine.sub)}</span></div>`; return; }
    el.classList.add('quiet'); el.style.setProperty('--c', 'var(--ok)');
    el.innerHTML = `<div><div class="k">Done</div></div><div class="w">Everything for today is ticked.</div>`;
  }

  // ---------- Day calendar: grouped blocks by time ----------
  const PX_PER_MIN = 54 / 60;
  function calendarHTML(tiles, dateStr, isToday, nowMin) {
    const blocks = [];
    const doneAll = (lines) => lines.every((l) => lineState(l, dateStr).done);
    const lateAny = (lines) => isToday && lines.some((l) => { const st = lineState(l, dateStr); const end = l.endMin ?? l.min; return !st.done && end != null && end < nowMin; });
    const timed = (t) => t.lines.filter((l) => l.min != null).sort(byMin);
    for (const t of tiles) {
      const ls = timed(t);
      if (!ls.length) continue;
      if (t.id === 'burn' || t.id === 'harv') {
        const gap = t.id === 'burn' ? 20 : 30;
        blocks.push({ start: ls[0].min, end: ls[ls.length - 1].min + gap, color: t.color, title: ls.length === 1 ? (t.id === 'burn' ? 'Burn ' : 'Harvest ') + ls[0].label : `${ls.length} ${t.id === 'burn' ? 'burns' : 'harvests'}`, done: doneAll(ls), late: lateAny(ls) });
      } else if (t.id === 'bupe') {
        for (const l of ls) blocks.push({ start: l.min, end: l.endMin ?? l.min + 120, color: t.color, title: l.ids ? `Bupe · ${l.label}` : `Bupe ${l.label}`, done: doneAll([l]), late: lateAny([l]) });
      } else if (t.id === 'txa') {
        for (const l of ls) blocks.push({ start: l.min, end: l.min + 25, color: t.color, title: `TXA ${l.label}`, sub: l.sub, done: doneAll([l]), late: lateAny([l]) });
      }
    }
    const chk = tiles.find((t) => t.id === 'chk');
    const first = blocks.length ? Math.min(...blocks.map((b) => b.start)) : 8 * 60;
    const last = blocks.length ? Math.max(...blocks.map((b) => b.end)) : 17 * 60;
    if (chk) {
      const am = chk.lines.find((l) => l.key === 'am|all'), pm = chk.lines.find((l) => l.key === 'pm|all');
      if (am) blocks.push({ start: first - 60, end: first, color: chk.color, title: 'AM checks', soft: true, done: doneAll([am]) });
      if (pm) blocks.push({ start: last, end: last + 60, color: chk.color, title: 'PM check', soft: true, done: doneAll([pm]) });
    }
    if (!blocks.length) return '';
    const h0 = Math.min(7, Math.floor(Math.min(...blocks.map((b) => b.start)) / 60));
    const h1 = Math.max(19, Math.ceil(Math.max(...blocks.map((b) => b.end)) / 60));
    const H = (h1 - h0) * 60 * PX_PER_MIN;
    const y = (min) => (min - h0 * 60) * PX_PER_MIN;
    blocks.sort((a, b) => a.start - b.start || a.end - b.end);
    // Overlapping blocks share the width, side by side.
    let cluster = null;
    for (const b of blocks) {
      if (!cluster || b.start >= cluster.end) { cluster = { end: b.end, cols: [], items: [] }; }
      let col = cluster.cols.findIndex((e) => e <= b.start);
      if (col < 0) col = cluster.cols.length;
      cluster.cols[col] = b.end; cluster.end = Math.max(cluster.end, b.end);
      b.col = col; b.cluster = cluster; cluster.items.push(b);
    }
    let html = '';
    for (let h = h0; h <= h1; h++) html += `<div class="hr" style="top:${y(h * 60)}px"><b>${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}</b></div>`;
    for (const b of blocks) {
      const n = b.cluster.cols.length, w = 100 / n;
      html += `<div class="ev${b.done ? ' done' : ''}${b.late ? ' late' : ''}${b.soft ? ' soft' : ''}" style="--c:${b.color};top:${y(b.start)}px;height:${Math.max(22, (b.end - b.start) * PX_PER_MIN - 2)}px;left:calc(${b.col * w}% + ${b.col ? 3 : 0}px);width:calc(${w}% - ${n > 1 ? 3 : 0}px)"><b>${esc(b.title)}</b><span>${b.soft ? (b.title.startsWith('AM') ? 'before the first task' : 'after the last task') : esc(b.sub ? fmtMin(b.start) + ' · ' + b.sub : fmtMin(b.start) + ' – ' + fmtMin(b.end))}</span></div>`;
    }
    if (isToday && nowMin >= h0 * 60 && nowMin <= h1 * 60) html += `<div class="nowline" style="top:${y(nowMin)}px"></div>`;
    return `<section class="cal"><h2>Day<span class="n">${esc(fmtMin(h0 * 60))} – ${esc(fmtMin(h1 * 60))}</span></h2><div class="grid" style="height:${H}px">${html}</div></section>`;
  }

  function render() {
    try { renderInner(); }
    catch (e) { $('board').innerHTML = `<div class="notice bad">Page error while drawing ${esc(md(view))}: ${esc(e.message)}</div>`; }
  }
  function renderInner() {
    const dateStr = md(view);
    const isToday = dateStr === md(centralToday());
    const nowMin = centralNowMin();
    $('dateLabel').textContent = fullDate(view);
    $('todayBtn').hidden = isToday;
    const day = days.find((d) => d.date === dateStr);
    $('weekLabel').textContent = day && day.week ? day.week.replace(/^WEEK\s*/i, 'Week ') : '';
    const notices = [];
    let tiles = [];
    let p = null, chk = { head: '', mice: [] };
    if (!days.length) { $('board').innerHTML = ''; $('progress').textContent = ''; return; }
    if (!day) notices.push({ cls: '', text: `${fullDate(view)} is not on the Calendar.` });
    else {
      p = parseDay(day);
      chk = checks[dateStr] || { head: '', mice: [] };
      tiles = buildTiles(p, chk);
      for (const t of p.info) notices.push({ cls: '', text: t });
      for (const t of p.notes) notices.push({ cls: '', text: t });
      if (p.warnings.length) notices.push({ cls: 'warn', text: 'Sheet check: ' + p.warnings.join(' · ') });
    }
    const all = tiles.flatMap((t) => t.lines);
    const doneN = all.filter((l) => lineState(l, dateStr).done).length;
    $('progress').innerHTML = all.length ? `<b>${doneN}</b> of ${all.length} done` : '';
    $('notices').innerHTML = notices.map((n) => `<div class="notice ${n.cls}">${esc(n.text)}</div>`).join('');
    nowHTML(tiles, dateStr, isToday, nowMin);
    const nextKey = nowItem ? nowItem.key : (pendingTimed[0] ? pendingTimed[0].key : null);
    const tmrw = tomorrowTile();
    const col = { 1: ['chk', 'burn'], 2: ['bupe', 'txa'], 3: ['harv', 'img', 'tmrw'] };
    const order = { chk: 1, burn: 2, bupe: 3, txa: 4, harv: 5, img: 6, tmrw: 7 };
    const byId = Object.fromEntries(tiles.map((t) => [t.id, t])); byId.tmrw = tmrw;
    let html = '';
    for (const c of [1, 2, 3]) html += `<div class="colm">${col[c].map((id) => byId[id] ? tileHTML(byId[id], dateStr, isToday, nowMin, nextKey, order[id]) : '').join('')}</div>`;
    html += calendarHTML(tiles, dateStr, isToday, nowMin);
    $('board').innerHTML = html;
    updateTitle();
  }
  function updateTitle() { document.title = lateItems.length ? `⏰ ${lateItems.length} late · Run sheet` : (nowItem ? `${nowItem.time} ${nowItem.summary} · Run sheet` : 'Run sheet'); }

  // Live countdown + clock without a full re-render.
  function tickClock() {
    $('clock').textContent = centralClock(false);
    const cd = $('cd');
    if (!cd || !nowItem) return;
    const sec = centralNowSec();
    if (lateItems.length) { cd.innerHTML = `${esc(minsText(Math.max(0, Math.floor(sec / 60) - nowItem.end)))}<small>late</small>`; return; }
    const dueSec = nowItem.min * 60;
    if (sec < dueSec) {
      const left = dueSec - sec;
      cd.innerHTML = (left <= 600 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : esc(minsText(Math.ceil(left / 60)))) + '<small>until due</small>';
    } else if (nowItem.endMin != null) cd.innerHTML = `${esc(minsText(Math.max(0, nowItem.end - Math.floor(sec / 60))))}<small>left in window</small>`;
  }

  function setSheetStatus(kind, text) { const el = $('sheetStatus'); el.className = 'st' + (kind ? ' ' + kind : ''); el.textContent = text; }
  function setTickStatus(kind, text) { const el = $('tickStatus'); el.className = kind || ''; el.textContent = text; el.style.color = kind === 'bad' ? 'var(--late)' : ''; }

  async function refreshSheet() {
    let cal, chk;
    try {
      [cal, chk] = await Promise.all([fetchTable('Calendar'), fetchTable('Checks')]);
    } catch (e) {
      setSheetStatus('bad', `Couldn’t reach the Sheet${lastRead ? ' · showing the ' + lastRead + ' read' : ''}`);
      if (!days.length) $('now').innerHTML = `<div class="w">Couldn’t reach the Sheet<span>${esc(e.message)}</span></div>`;
      return;
    }
    days = buildDays(cal);
    checks = buildChecks(chk);
    lastRead = centralClock(false);
    setSheetStatus('', `Sheet read ${lastRead}`);
    render();
    checkAlerts();
  }

  // ---------- Alerts: notification + chime 10 min before, at due time, and every 5 min while late ----------
  let alertsOn = store.get('runsheet.alerts') === '1';
  let audio = null;
  const fired = {};
  function chime() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const t0 = audio.currentTime;
      [[880, 0, 0.14], [1174.7, 0.16, 0.2]].forEach(([f, dt, dur]) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(0.18, t0 + dt + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + dur);
        o.connect(g).connect(audio.destination); o.start(t0 + dt); o.stop(t0 + dt + dur + 0.05);
      });
    } catch (e) { /* no audio */ }
  }
  function notify(title, body) {
    chime();
    if ('Notification' in window && Notification.permission === 'granted') { try { new Notification(title, { body, tag: title + body, renotify: true }); } catch (e) { /* no notifications */ } }
  }
  function checkAlerts() {
    if (!alertsOn) return;
    if (md(view) !== md(centralToday())) return;
    const nowMin = centralNowMin();
    const day = md(centralToday());
    fired[day] = fired[day] || {};
    const f = fired[day];
    for (const it of pendingTimed) {
      const d = it.min - nowMin;
      if (d <= 10 && d > 0 && !f[it.key + '|pre']) { f[it.key + '|pre'] = 1; notify(`In ${d} min · ${it.time}`, it.summary); }
      if (d <= 0 && !f[it.key + '|due']) { f[it.key + '|due'] = 1; notify(`Due now · ${it.time}`, it.summary + (it.endMin != null ? ` · window until ${fmtMin(it.endMin)}` : '')); }
    }
    for (const it of lateItems) {
      const last = f[it.key + '|late'] || 0;
      if (nowMin - last >= 5) { f[it.key + '|late'] = nowMin; notify(`LATE ${minsText(nowMin - it.end)} · ${it.time}`, it.summary); }
    }
  }
  function setAlerts(on) {
    alertsOn = on; store.set('runsheet.alerts', on ? '1' : '0');
    const b = $('alerts'); b.textContent = on ? 'Alerts on' : 'Alerts off'; b.classList.toggle('on', on);
    if (on) {
      chime();
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    }
  }

  // ---------- Wiring ----------
  function go(d) { view = d; render(); loadShared(md(view)); }
  $('prev').addEventListener('click', () => go(addDays(view, -1)));
  $('next').addEventListener('click', () => go(addDays(view, 1)));
  $('todayBtn').addEventListener('click', () => go(centralToday()));
  $('board').addEventListener('click', (e) => {
    const el = e.target.closest('.ln[data-key]');
    if (!el || el.dataset.locked) return;
    setTick(el.dataset.key, !el.classList.contains('done'));
  });
  $('alerts').addEventListener('click', () => setAlerts(!alertsOn));
  $('initials').addEventListener('click', () => {
    const v = prompt('Your initials (stamped on each tick)', initials());
    if (v == null) return;
    store.set('runsheet.initials', v.trim().toUpperCase()); showInitials();
  });
  function showInitials() { $('initials').textContent = initials() || 'Initials'; }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshSheet(); loadShared(md(view)); } });
  setInterval(refreshSheet, SHEET_REFRESH_MS);
  setInterval(() => { if (!document.hidden) loadShared(md(view)); }, TICK_POLL_MS);
  setInterval(() => { render(); checkAlerts(); }, 30000);
  setInterval(tickClock, 1000);

  // Prep rules are loaded fresh on every page load (no browser cache), so edits to prep-rules.js show up on the next refresh.
  function loadRules() {
    const s = document.createElement('script');
    s.src = 'prep-rules.js?t=' + Date.now();
    s.onload = render;
    s.onerror = () => { window.PREP_RULES = window.PREP_RULES || []; render(); };
    document.head.appendChild(s);
  }

  loadLocal();
  showInitials();
  setAlerts(alertsOn);
  tickClock();
  render();
  loadRules();
  refreshSheet();
  loadShared(md(view));
})();
</script>
</body>
</html>
